<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <!-- Glow filters for clusters -->
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#e74c3c" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#3498db" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-yellow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#f1c40f" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle background glows behind clusters -->
    <radialGradient id="bg-glow1" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow2" cx="45%" cy="55%">
      <stop offset="0%" stop-color="#3498db" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3498db" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow3" cx="25%" cy="75%">
      <stop offset="0%" stop-color="#f1c40f" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f1c40f" stop-opacity="0"/>
    </radialGradient>
    <!-- Stream arrow gradient (fade from left) -->
    <linearGradient id="stream-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#888" stop-opacity="0"/>
      <stop offset="40%" stop-color="#888" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#888" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="250" rx="16" ry="16" fill="#1a1d23"/>

  <!-- Subtle background glows behind clusters -->
  <ellipse cx="280" cy="80" rx="140" ry="100" fill="url(#bg-glow1)"/>
  <ellipse cx="360" cy="140" rx="130" ry="100" fill="url(#bg-glow2)"/>
  <ellipse cx="200" cy="180" rx="130" ry="90" fill="url(#bg-glow3)"/>

  <!-- ==================== STREAM VISUALIZATION ==================== -->
  <!-- Stream flow line (curved path fading from left) -->
  <path d="M 10,125 C 40,125 60,110 90,105" stroke="url(#stream-fade)" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <path d="M 10,135 C 40,140 60,155 90,165" stroke="url(#stream-fade)" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <path d="M 10,130 C 50,130 70,130 110,130" stroke="url(#stream-fade)" stroke-width="2" fill="none" stroke-dasharray="6,4"/>

  <!-- Stream nodes: small gray nodes arriving from the left, getting progressively more visible -->
  <circle cx="18" cy="125" r="3" fill="#666" opacity="0.2"/>
  <circle cx="30" cy="130" r="3" fill="#777" opacity="0.3"/>
  <circle cx="44" cy="122" r="3.5" fill="#888" opacity="0.35"/>
  <circle cx="56" cy="135" r="3.5" fill="#888" opacity="0.4"/>
  <circle cx="68" cy="127" r="4" fill="#999" opacity="0.5"/>
  <circle cx="82" cy="118" r="4" fill="#999" opacity="0.55"/>
  <circle cx="94" cy="140" r="4.5" fill="#aaa" opacity="0.6"/>
  <circle cx="108" cy="130" r="5" fill="#aaa" opacity="0.65"/>

  <!-- Transitioning nodes: being assigned to clusters (partially colored) -->
  <circle cx="125" cy="108" r="5.5" fill="#c0392b" opacity="0.5"/>
  <circle cx="130" cy="155" r="5.5" fill="#d4ac0d" opacity="0.5"/>
  <circle cx="140" cy="130" r="5.5" fill="#2e86c1" opacity="0.5"/>

  <!-- ==================== GRAPH EDGES ==================== -->
  <!-- Intra-cluster edges (solid, colored faintly) -->

  <!-- Red cluster edges (upper-left area) -->
  <line x1="190" y1="60" x2="240" y2="50" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="190" y1="60" x2="170" y2="100" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="190" y1="60" x2="250" y2="95" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="240" y1="50" x2="300" y2="65" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="240" y1="50" x2="250" y2="95" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="170" y1="100" x2="250" y2="95" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="300" y1="65" x2="250" y2="95" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Blue cluster edges (center-right area) -->
  <line x1="310" y1="115" x2="360" y2="100" stroke="#3498db" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="310" y1="115" x2="290" y2="155" stroke="#3498db" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="360" y1="100" x2="400" y2="135" stroke="#3498db" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="360" y1="100" x2="290" y2="155" stroke="#3498db" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="290" y1="155" x2="350" y2="160" stroke="#3498db" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="400" y1="135" x2="350" y2="160" stroke="#3498db" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Yellow cluster edges (lower-left area) -->
  <line x1="160" y1="175" x2="220" y2="165" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="160" y1="175" x2="185" y2="210" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="220" y1="165" x2="185" y2="210" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="220" y1="165" x2="270" y2="200" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="185" y1="210" x2="270" y2="200" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Inter-cluster edges (dashed, dim) -->
  <line x1="250" y1="95" x2="310" y2="115" stroke="#888" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="170" y1="100" x2="160" y2="175" stroke="#888" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="350" y1="160" x2="270" y2="200" stroke="#888" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="290" y1="155" x2="220" y2="165" stroke="#888" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>

  <!-- ==================== GRAPH NODES ==================== -->
  <!-- Red cluster nodes -->
  <circle cx="190" cy="60" r="10" fill="#e74c3c" filter="url(#glow-red)"/>
  <circle cx="240" cy="50" r="10" fill="#e74c3c" filter="url(#glow-red)"/>
  <circle cx="170" cy="100" r="10" fill="#e74c3c" filter="url(#glow-red)"/>
  <circle cx="250" cy="95" r="10" fill="#e74c3c" filter="url(#glow-red)"/>
  <circle cx="300" cy="65" r="10" fill="#e74c3c" filter="url(#glow-red)"/>

  <!-- Blue cluster nodes -->
  <circle cx="310" cy="115" r="10" fill="#3498db" filter="url(#glow-blue)"/>
  <circle cx="360" cy="100" r="10" fill="#3498db" filter="url(#glow-blue)"/>
  <circle cx="290" cy="155" r="10" fill="#3498db" filter="url(#glow-blue)"/>
  <circle cx="400" cy="135" r="10" fill="#3498db" filter="url(#glow-blue)"/>
  <circle cx="350" cy="160" r="10" fill="#3498db" filter="url(#glow-blue)"/>

  <!-- Yellow cluster nodes -->
  <circle cx="160" cy="175" r="10" fill="#f1c40f" filter="url(#glow-yellow)"/>
  <circle cx="220" cy="165" r="10" fill="#f1c40f" filter="url(#glow-yellow)"/>
  <circle cx="185" cy="210" r="10" fill="#f1c40f" filter="url(#glow-yellow)"/>
  <circle cx="270" cy="200" r="10" fill="#f1c40f" filter="url(#glow-yellow)"/>

  <!-- ==================== TEXT ==================== -->
  <!-- Title -->
  <text x="520" y="110" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="1">CluStRE</text>

  <!-- Subtitle -->
  <text x="524" y="145" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#a0a8b4" letter-spacing="0.5">Streaming Graph Clustering</text>

  <!-- ==================== LEGEND ==================== -->
  <!-- Cluster 1 -->
  <circle cx="528" cy="190" r="6" fill="#e74c3c"/>
  <text x="542" y="194" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8890a0">Cluster 1</text>

  <!-- Cluster 2 -->
  <circle cx="628" cy="190" r="6" fill="#3498db"/>
  <text x="642" y="194" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8890a0">Cluster 2</text>

  <!-- Cluster 3 -->
  <circle cx="728" cy="190" r="6" fill="#f1c40f"/>
  <text x="742" y="194" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8890a0">Cluster 3</text>

  <!-- Stream legend -->
  <circle cx="528" cy="215" r="4" fill="#999" opacity="0.7"/>
  <circle cx="536" cy="215" r="3.5" fill="#888" opacity="0.5"/>
  <circle cx="543" cy="215" r="3" fill="#777" opacity="0.35"/>
  <text x="558" y="219" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8890a0">Stream</text>
</svg>
